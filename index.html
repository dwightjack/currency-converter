<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <title>CurrConv</title>
    <meta name="description" content="A simple currency converter" />

    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="dark light" />
    <script>
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document
          .querySelector('link[rel=manifest]')
          ?.setAttribute('href', 'manifest-dark.webmanifest');
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body
    class="font-sans bg-gradient-to-tr from-sky-200 to-sky-50 bg-no-repeat bg-contain text-brand-800 min-block-[100dvb] flex lg:items-center @dark:(from-cyan-950 to-cyan-900 text-brand-100)"
  ></body>
</html>
